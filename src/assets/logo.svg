<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="paycore-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer circle with vibrant blue gradient and shadow -->
  <circle cx="50" cy="50" r="46" fill="url(#paycore-blue-grad)" filter="url(#soft-glow)" />
  
  <!-- Subtle inner glowing rim -->
  <circle cx="50" cy="50" r="44" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Clean, bold white Bitcoin symbol matching UI reference -->
  <text x="50" y="66" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="52" 
        fill="#FFFFFF">₿</text>
</svg>
